<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Find Players — Ionic</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css">
<style>
:root{color-scheme:dark;--ion-background-color:#090909;--ion-text-color:#f7f7f7;--ion-color-primary:#5b9df6;--ion-font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}*{box-sizing:border-box}html,body,ion-app,ion-content{background:#090909}ion-content{--background:#090909}ion-toolbar{--background:#000;--color:#fff}ion-tab-bar{--background:#141414;--border:1px solid #292929;--color:#8996a9;--color-selected:#fff;height:calc(65px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}ion-tab-button{--color:#8996a9;--color-selected:#fff;font-size:11px}ion-tab-button ion-icon{font-size:24px;margin-bottom:4px}ion-tab-button.tab-selected{font-weight:700}.top{background:#000;padding:calc(env(safe-area-inset-top) + 24px) 15px 6px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.heading h1{font-size:27px;line-height:1.2;letter-spacing:-.7px;font-weight:750;margin:0;color:#fff}.actions{display:flex;gap:7px}.action{position:relative;background:#1b1b1b;border:0;border-radius:11px;color:#8f8f8f;width:35px;height:35px;display:grid;place-items:center}.action ion-icon{font-size:19px}.badge{position:absolute;right:-3px;top:-3px;background:#5b9df6;color:#000;font-weight:700;font-size:11px;border-radius:10px;padding:2px 5px}.pillrow{display:flex;gap:8px;margin:13px 0 11px}.pill{border:1px solid #343434;background:#1b1b1b;color:#9c9c9c;border-radius:999px;padding:7px 17px;font-size:13px;white-space:nowrap;min-height:32px}.pill.selected{background:#5b9df6;color:#050505;border-color:#5b9df6;font-weight:700}.switch{display:flex;background:#1b1b1b;border:1px solid #343434;border-radius:999px;overflow:hidden;height:32px}.switch button{flex:1;border:0;background:transparent;color:#999;font-size:13px}.switch button.selected{background:#5b9df6;color:#000;font-weight:700}.count{color:#737373;font-size:13px;margin:17px 19px 13px}.player{background:#141414;border:1px solid #252525;border-radius:15px;margin:0 15px 10px;padding:14px 15px;display:flex;align-items:center;gap:12px;min-height:74px}.avatar{width:46px;height:46px;border-radius:50%;background:#1d1d1d;display:grid;place-items:center;flex:none;color:#777;font-size:24px}.avatar ion-icon{font-size:23px}.details{min-width:0;flex:1}.name{font-size:15px;font-weight:750;white-space:nowrap;margin-bottom:6px}.meta{color:#727272;font-size:12px;display:flex;align-items:center;gap:5px}.meta ion-icon{font-size:12px}.chat{background:#5b9df6;color:#000;border:0;border-radius:999px;font-size:14px;font-weight:750;padding:9px 15px;min-width:63px}.screen{min-height:100%}.placeholder{padding:22px;color:#999;text-align:center}ion-alert{--background:#202020} @media(min-width:600px){.screen{max-width:480px;margin:auto}}
</style>
</head>
<body><ion-app mode="ios"><ion-content fullscreen><div class="screen"><header class="top"><div class="heading"><h1>Find Players</h1><div class="actions"><button class="action" aria-label="Notifications"><ion-icon name="notifications"></ion-icon><span class="badge">1</span></button><button class="action" aria-label="Messages"><ion-icon name="chatbox-outline"></ion-icon><span class="badge">1</span></button></div></div><div class="pillrow"><button class="pill" data-top="Feed">Feed</button><button class="pill selected" data-top="Near Me">Near Me</button><button class="pill" data-top="Leaderboard">Leaderboard</button></div><div class="switch"><button class="selected" data-view="Players">Players</button><button data-view="Map">Map</button></div></header><main id="results"><p class="count">2 players within 50 miles</p><article class="player"><div class="avatar"><ion-icon name="person"></ion-icon></div><div class="details"><div class="name">VICTOR</div><div class="meta"><ion-icon name="location"></ion-icon>13 mi <span style="padding:0 2px">|</span><ion-icon name="tennisball-outline"></ion-icon>3.60</div></div><button class="chat" data-chat="VICTOR">Chat</button></article><article class="player"><div class="avatar"><ion-icon name="person"></ion-icon></div><div class="details"><div class="name">Ricardo D.</div><div class="meta"><ion-icon name="location"></ion-icon>48 mi</div></div><button class="chat" data-chat="Ricardo D.">Chat</button></article></main></div></ion-content><ion-footer><ion-tab-bar><ion-tab-button tab="home"><ion-icon name="home-outline"></ion-icon><ion-label>Home</ion-label></ion-tab-button><ion-tab-button tab="drills"><ion-icon name="fitness-outline"></ion-icon><ion-label>Drills</ion-label></ion-tab-button><ion-tab-button tab="ai"><ion-icon name="tennisball-outline"></ion-icon><ion-label>PickleAI</ion-label></ion-tab-button><ion-tab-button tab="lessons"><ion-icon name="trophy-outline"></ion-icon><ion-label>Lessons</ion-label></ion-tab-button><ion-tab-button tab="social" class="tab-selected"><ion-icon name="people"></ion-icon><ion-label>Social</ion-label></ion-tab-button></ion-tab-bar></ion-footer></ion-app>
<script type="module">import {addIcons} from 'https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.esm.js';import{notifications,chatboxOutline,person,location,tennisballOutline,homeOutline,fitnessOutline,trophyOutline,people}from'https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/icons/index.js';addIcons({notifications,chatboxOutline,person,location,tennisballOutline,homeOutline,fitnessOutline,trophyOutline,people});const original=document.querySelector('#results').innerHTML;async function alertText(header,message){const a=document.createElement('ion-alert');a.header=header;a.message=message;a.buttons=['OK'];document.body.append(a);await a.present()}document.addEventListener('click',e=>{const chat=e.target.closest('[data-chat]');if(chat)alertText('Chat',`Conversa com ${chat.dataset.chat} — demonstração visual.`);const top=e.target.closest('[data-top]');if(top){document.querySelectorAll('[data-top]').forEach(x=>x.classList.toggle('selected',x===top));document.querySelector('#results').innerHTML=top.dataset.top==='Near Me'?original:`<p class="placeholder">${top.dataset.top} — demonstração visual</p>`}const view=e.target.closest('[data-view]');if(view){document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('selected',x===view));document.querySelector('#results').innerHTML=view.dataset.view==='Players'?original:'<p class="placeholder">Map — demonstração visual</p>'}const action=e.target.closest('.action');if(action)alertText(action.getAttribute('aria-label'),'Demonstração visual');const tab=e.target.closest('ion-tab-button');if(tab){document.querySelectorAll('ion-tab-button').forEach(x=>x.classList.toggle('tab-selected',x===tab));if(tab.tab!=='social')alertText(tab.querySelector('ion-label').textContent,'Demonstração visual')}});</script>
</body></html>
